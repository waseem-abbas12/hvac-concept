<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 70" width="320" height="70" fill="none">
  <defs>
    <linearGradient id="warmFlame" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3B30" />
      <stop offset="50%" stop-color="#FF9500" />
      <stop offset="100%" stop-color="#FFCC00" />
    </linearGradient>
    <linearGradient id="coolFrost" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C7FF" />
      <stop offset="50%" stop-color="#007AFF" />
      <stop offset="100%" stop-color="#5856D6" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Thermocline Dual-Wing Icon -->
  <g transform="translate(6, 7)" filter="url(#subtleGlow)">
    <!-- Cooling Flow Arc -->
    <path d="M 28 6 C 14 6, 4 17, 4 30 C 4 43, 14 54, 28 54 C 23 47, 20 39, 20 30 C 20 21, 23 13, 28 6 Z" fill="url(#coolFrost)" />
    <!-- Center Air Vortex -->
    <path d="M 28 12 C 22 17, 18 23, 18 30 C 18 37, 22 43, 28 48 C 34 43, 38 37, 38 30 C 38 23, 34 17, 28 12 Z" fill="#00B4D8" opacity="0.9" />
    <!-- Heating Flame Arc -->
    <path d="M 28 6 C 34 13, 37 21, 37 30 C 37 39, 34 47, 28 54 C 42 54, 52 43, 52 30 C 52 17, 42 6, 28 6 Z" fill="url(#warmFlame)" />
    <!-- Dynamic Air Stream Core -->
    <circle cx="28" cy="30" r="4.5" fill="#FFFFFF" />
  </g>

  <!-- Typography -->
  <g transform="translate(70, 10)">
    <!-- Brand Name -->
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="900" font-size="31" letter-spacing="-0.5" fill="#0B132B">
      PRIME<tspan fill="#007AFF">AIR</tspan>
    </text>
    
    <!-- Subtitle -->
    <text x="1.5" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="700" font-size="9.5" letter-spacing="3.2" fill="#6C7A89">
      HEATING &amp; COOLING
    </text>

    <!-- Accent Micro Badge -->
    <rect x="180" y="16" width="56" height="18" rx="4" fill="#007AFF" fill-opacity="0.1" />
    <text x="208" y="28.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="9" letter-spacing="1" fill="#007AFF">PRO</text>
  </g>
</svg>
