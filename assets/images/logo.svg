<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 64" width="340" height="64" fill="none">
  <defs>
    <linearGradient id="warmFlame" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2D55" />
      <stop offset="50%" stop-color="#FF9500" />
      <stop offset="100%" stop-color="#FFCC00" />
    </linearGradient>
    <linearGradient id="coolFrost" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="50%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#3A36D5" />
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Large Thermocline Dual-Wing Icon -->
  <g transform="translate(4, 4)" filter="url(#subtleGlow)">
    <!-- Cooling Flow Arc -->
    <path d="M 28 4 C 13 4, 2 16, 2 30 C 2 44, 13 56, 28 56 C 22 48, 19 39, 19 30 C 19 21, 22 12, 28 4 Z" fill="url(#coolFrost)" />
    <!-- Center Air Vortex -->
    <path d="M 28 10 C 21 16, 17 22, 17 30 C 17 38, 21 44, 28 50 C 35 44, 39 38, 39 30 C 39 22, 35 16, 28 10 Z" fill="#00B4D8" opacity="0.95" />
    <!-- Heating Flame Arc -->
    <path d="M 28 4 C 34 12, 37 21, 37 30 C 37 39, 34 48, 28 56 C 43 56, 54 44, 54 30 C 54 16, 43 4, 28 4 Z" fill="url(#warmFlame)" />
    <!-- Core Spark -->
    <circle cx="28" cy="30" r="4.5" fill="#FFFFFF" />
  </g>

  <!-- Large Punchy Typography -->
  <g transform="translate(68, 6)">
    <!-- Brand Name (Large & Bold) -->
    <text x="0" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', 'Inter', sans-serif" font-weight="900" font-size="40" letter-spacing="-0.5" fill="#0B132B">
      PRIME<tspan fill="#0066FF">AIR</tspan>
    </text>
    
    <!-- Subtitle -->
    <text x="2" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="11.5" letter-spacing="4" fill="#64748B">
      HEATING &amp; COOLING
    </text>

    <!-- Micro Badge -->
    <rect x="228" y="14" width="44" height="22" rx="5" fill="#0066FF" fill-opacity="0.12" stroke="#0066FF" stroke-width="1" />
    <text x="250" y="29" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="11" letter-spacing="1" fill="#0066FF">PRO</text>
  </g>
</svg>
